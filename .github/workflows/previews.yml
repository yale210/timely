name: Preview Environment

on:
  pull_request:
    types: [closed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  preview-destroy:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Destroy preview
        id: preview_destroy
        uses: SubhanAfz/branch-previewer-action@v1.1
        with:
          operation: destroy
          api_base_url: ${{ secrets.PREVIEW_API_URL }}
          api_key: ${{ secrets.PREVIEW_API_KEY }}
          repo_slug: ${{ github.repository }}
          branch: ${{ github.event.pull_request.head.ref }}
          ignore_missing_on_destroy: "true"

  resolve-pr-context:
    if: >-
      (github.event_name == 'pull_request_review_comment' || github.event_name == 'issue_comment') &&
      contains(github.event.comment.body, '/preview_start') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Resolve PR head ref and SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;

            if (!prNumber) {
              core.setFailed("Unable to resolve pull request number from event payload");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
  
  build:
    needs: [resolve-pr-context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr-context.outputs.head_ref }}
      - name: Build backend
        run: docker build -t backend-test backend
      - name: Build frontend  
        run: docker build -t frontend-test frontend

  preview-create-from-comment:
    needs: [resolve-pr-context, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr-context.outputs.head_ref }}

      - name: Create preview from comment
        id: preview_create_comment
        uses: SubhanAfz/branch-previewer-action@v1.1
        with:
          operation: create
          api_base_url: ${{ secrets.PREVIEW_API_URL }}
          api_key: ${{ secrets.PREVIEW_API_KEY }}
          repo_slug: ${{ github.repository }}
          branch: ${{ needs.resolve-pr-context.outputs.head_ref }}
          commit_sha: ${{ needs.resolve-pr-context.outputs.head_sha }}
          pr_number: ${{ needs.resolve-pr-context.outputs.pr_number }}
      - name: Upsert preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- preview-environment-comment -->";
            const issueNumber = Number(`${{ needs.resolve-pr-context.outputs.pr_number }}`.trim());
            const ip = `${{ steps.preview_create_comment.outputs.ip || '' }}`.trim();
            const previewUrl = `${{ steps.preview_create_comment.outputs.url || '' }}`.trim();

            const body = `${marker}
            ## Preview Environment
            - **URL:** ${previewUrl ? `[${previewUrl}](${previewUrl})` : "`N/A`"}
            - **IP:** \`${ip || "N/A"}\`
            - **Droplet ID:** \`${{ steps.preview_create_comment.outputs.droplet_id || 'N/A' }}\`
            - **Created:** \`${{ steps.preview_create_comment.outputs.created || 'N/A' }}\`
            - **Expires In (s):** \`${{ steps.preview_create_comment.outputs.seconds_remaining || 'N/A' }}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
