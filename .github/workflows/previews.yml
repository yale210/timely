name: Preview Environment

on:
  pull_request:
    types: [closed]
  pull_request_review_comment:
    types: [created]

jobs:
  preview-destroy:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Destroy preview
        id: preview_destroy
        uses: SubhanAfz/branch-previewer-action@v1
        with:
          operation: destroy
          api_base_url: ${{ secrets.PREVIEW_API_URL }}
          api_key: ${{ secrets.PREVIEW_API_KEY }}
          repo_slug: ${{ github.repository }}
          branch: ${{ github.event.pull_request.head.ref }}
          ignore_missing_on_destroy: "true"
  
  build:
    if: github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/preview_start')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t backend-test backend
      - name: Build frontend  
        run: docker build -t frontend-test frontend

  preview-create-from-comment:
    if: github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/preview_start')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create preview from comment
        id: preview_create_comment
        uses: SubhanAfz/branch-previewer-action@v1
        with:
          operation: create
          api_base_url: ${{ secrets.PREVIEW_API_URL }}
          api_key: ${{ secrets.PREVIEW_API_KEY }}
          repo_slug: ${{ github.repository }}
          branch: ${{ github.event.pull_request.head.ref }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
      - name: Upsert preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- preview-environment-comment -->";
            const ip = `${{ steps.preview_create_comment.outputs.ip || '' }}`.trim();
            const previewUrl = ip ? `http://${ip}` : "N/A";

            const body = `${marker}
            ## Preview Environment
            - **URL:** ${ip ? `[${previewUrl}](${previewUrl})` : "`N/A`"}
            - **IP:** \`${ip || "N/A"}\`
            - **Droplet ID:** \`${{ steps.preview_create_comment.outputs.droplet_id || 'N/A' }}\`
            - **Created:** \`${{ steps.preview_create_comment.outputs.created || 'N/A' }}\`
            - **Expires In (s):** \`${{ steps.preview_create_comment.outputs.seconds_remaining || 'N/A' }}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }