name: Lint/Test backend

permissions:
    contents: read
    pull-requests: write
    issues: write

on:
    pull_request:
        branches:
            - main
        paths:
            - "backend/**"
    workflow_dispatch:
    
jobs:
    lint:
        name: Run Ruff linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Ruff
              uses: astral-sh/ruff-action@v3
              with:
                  version: '0.14.5'
            - name: Run Ruff Linter
              run: |
                  ruff check backend
            - name: Run Ruff Formatter (if this fails, please run uv run ruff format . --fix)
              run: |
                  ruff format --check backend
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: 'pip'
            - name: Install dependencies
              run: |
                  cd backend
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install coverage
            - name: Run tests
              run: |
                  cd backend
                  coverage run manage.py test
                  coverage report --fail-under=90 -m
            - name: Generate coverage html
              if: always()
              run: |
                  cd backend
                  coverage html
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/htmlcov
                  retention-days: 3
            - name: Comment coverage artifact on PR
              if: always() && github.event_name == 'pull_request'
              uses: actions/github-script@v8
              with:
                  script: |
                      const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}#artifacts`;
                      const body = [
                          'Backend test coverage report HTML link',
                          '- Artifact name: backend-coverage',
                          `- Link to download: ${runUrl}`,
                      ].join('\n');
                      github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                      });
    docker-build-test:
        name: Test if backend docker build will work
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Build image
              run: |
                  docker build backend
