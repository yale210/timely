name: Lint/Test backend

on:
    pull_request:
        branches:
            - main
        paths:
            - "backend/**"
    workflow_dispatch:
    
jobs:
    lint:
        name: Run Ruff linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Ruff
              uses: astral-sh/ruff-action@v3
              with:
                  version: '0.14.5'
            - name: Run Ruff Linter
              run: |
                  ruff check backend
            - name: Run Ruff Formatter (if this fails, please run uv run ruff format . --fix)
              run: |
                  ruff format --check backend
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: 'pip'
            - name: Install dependencies
              run: |
                  cd backend
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            - name: Run tests
              run: |
                  python manage.py test
    