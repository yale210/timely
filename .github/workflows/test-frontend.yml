name: Lint frontend

on:
    pull_request:
        branches:
            - main
        paths:
            - "frontend/**"
    workflow_dispatch:

jobs:
    lint:
        name: Run ESLint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: |
                  npm ci
              working-directory: frontend
            - name: Run linter
              run: |
                  npm run lint
              working-directory: frontend
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              working-directory: frontend
              run: |
                npm ci
            - name: Run tests with coverage
              working-directory: frontend
              run: |
                npm run test -- --coverage
             
    docker-build-test:
        name: Test if frontend docker build will work
        needs: [lint]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Build image
              run: |
                  docker build frontend
