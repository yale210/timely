components:
  schemas:
    AdminUserList:
      type: object
      description: Serialize user data for the admin panel user list.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          pattern: ^[0-9a-zA-Z]*$
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        is_staff:
          type: boolean
        is_superuser:
          type: boolean
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - date_joined
      - email
      - id
      - username
    Assessment:
      type: object
      description: Serializer for the Assessment model.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 500
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        due_date:
          type: string
          format: date-time
        length_of_assessment:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          nullable: true
        weighting_of_assessment:
          type: integer
          maximum: 100
          minimum: 0
        notes:
          type: string
        reminder_offset:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        assessment_category:
          type: integer
          nullable: true
        module_category:
          type: integer
          nullable: true
        categories:
          type: array
          items:
            type: integer
        completed:
          type: boolean
        linked_event:
          type: integer
          readOnly: true
          nullable: true
        linked_event_details:
          allOf:
          - $ref: '#/components/schemas/EventResponse'
          nullable: true
          readOnly: true
        event_details:
          allOf:
          - $ref: '#/components/schemas/AssessmentEventInput'
          writeOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - due_date
      - id
      - linked_event
      - linked_event_details
      - title
      - updated_at
      - weighting_of_assessment
    AssessmentEventInput:
      type: object
      description: Serializer for inputting event details when creating or updating
        an assessment.
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
      required:
      - end_time
      - start_time
    AssessmentTypeEnum:
      enum:
      - COURSEWORK
      - EXAM
      - QUIZ
      - PRESENTATION
      - PRACTICAL
      - FORMATIVE
      - SUMMATIVE
      - OTHER
      type: string
      description: |-
        * `COURSEWORK` - Coursework
        * `EXAM` - Exam
        * `QUIZ` - Quiz
        * `PRESENTATION` - Presentation
        * `PRACTICAL` - Practical
        * `FORMATIVE` - Formative
        * `SUMMATIVE` - Summative
        * `OTHER` - Other
    BlankEnum:
      enum:
      - ''
    BroadcastJobDetail:
      type: object
      description: Serialize detailed broadcast job data with nested recipients.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 60
        message:
          type: string
          maxLength: 240
        target:
          $ref: '#/components/schemas/TargetEnum'
        status:
          $ref: '#/components/schemas/BroadcastStatusEnum'
        task_id:
          type: string
          maxLength: 255
        recipient_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        delivered_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        failed_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        sender:
          type: integer
          nullable: true
        sender_username:
          type: string
          readOnly: true
        audience_filters: {}
        audience_snapshot: {}
        provider_errors: {}
        queued_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
