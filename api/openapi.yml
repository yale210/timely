openapi: 3.0.3
info:
  title: Timely API
  version: 1.0.0
  description: OpenAPI schema for Timely backend
paths:
  /api/admin/audience_counts/:
    get:
      operationId: admin_audience_counts_retrieve
      description: |-
        Return audience counts for admin notification targeting.

        Args:
            request: The incoming DRF request.

        Returns:
            Response: Counts for each supported audience type.
      tags:
      - admin
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/admin/broadcasts/:
    get:
      operationId: admin_broadcasts_list
      description: |-
        List broadcast jobs with optional admin filters.

        Args:
            request: The incoming DRF request.

        Returns:
            Response: Paginated or full broadcast job list.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBroadcastJobListList'
          description: ''
  /api/admin/broadcasts/{broadcast_id}/:
    get:
      operationId: admin_broadcasts_retrieve
      description: |-
        Return detailed data for a single broadcast job.

        Args:
            request: The incoming DRF request.
            broadcast_id: Broadcast job primary key from the URL.

        Returns:
            Response: Broadcast detail payload or a not-found error.
      parameters:
      - in: path
        name: broadcast_id
        schema:
          type: integer
        description: Broadcast job primary key.
        required: true
      tags:
      - admin
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastJobDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastNotFoundResponse'
          description: ''
  /api/admin/broadcasts/{broadcast_id}/retry_failed/:
    post:
      operationId: admin_broadcasts_retry_failed_create
      description: |-
        Create a retry broadcast for failed recipients only.

        Args:
            request: The incoming DRF request.
            broadcast_id: Broadcast job primary key from the URL.

        Returns:
            Response: Accepted retry job metadata or an error payload.
      parameters:
      - in: path
        name: broadcast_id
        schema:
          type: integer
        description: Broadcast job primary key.
        required: true
      tags:
      - admin
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/admin/broadcasts/{broadcast_id}/status/:
    get:
      operationId: admin_broadcasts_status_retrieve
      description: |-
        Return summary status information for a broadcast job.

        Args:
            request: The incoming DRF request.
            broadcast_id: Broadcast job primary key from the URL.

        Returns:
            Response: Broadcast status payload or a not-found error.
      parameters:
      - in: path
        name: broadcast_id
        schema:
          type: integer
        description: Broadcast job primary key.
        required: true
      tags:
      - admin
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastStatusResponse'
          description: ''
  /api/admin/send_notification/:
    post:
      operationId: admin_send_notification_create
      description: |-
        Queue a broadcast notification for the selected audience.

        Args:
            request: The incoming DRF request.

        Returns:
            Response: Accepted broadcast metadata or a validation error.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserList'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_retrieve
      description: |-
        Return a paginated list of users for the admin panel.

        Args:
            request: The incoming DRF request.

        Returns:
            Response: Paginated or full serialized user list.
      tags:
      - admin
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/assessments/:
    get:
      operationId: assessments_list
      description: |-
        ViewSet for managing student assessments.

        Provides standard CRUD operations for assessments linked to the authenticated user.
      parameters:
      - in: query
        name: assessment_type
        schema:
          type: string
          enum:
          - COURSEWORK
          - EXAM
          - FORMATIVE
          - OTHER
          - PRACTICAL
          - PRESENTATION
          - QUIZ
          - SUMMATIVE
        description: |-
          * `COURSEWORK` - Coursework
          * `EXAM` - Exam
          * `QUIZ` - Quiz
          * `PRESENTATION` - Presentation
          * `PRACTICAL` - Practical
          * `FORMATIVE` - Formative
          * `SUMMATIVE` - Summative
          * `OTHER` - Other
      - in: query
        name: categories
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: completed
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - assessments
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assessment'
          description: ''
    post:
      operationId: assessments_create
      description: |-
        ViewSet for managing student assessments.

        Provides standard CRUD operations for assessments linked to the authenticated user.
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assessment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Assessment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Assessment'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
          description: ''
  /api/assessments/{id}/:
    get:
      operationId: assessments_retrieve
      description: |-
        ViewSet for managing student assessments.

        Provides standard CRUD operations for assessments linked to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this assessment.
        required: true
      tags:
      - assessments
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
          description: ''
    put:
      operationId: assessments_update
      description: |-
        ViewSet for managing student assessments.

        Provides standard CRUD operations for assessments linked to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this assessment.
        required: true
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assessment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Assessment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Assessment'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
          description: ''
    patch:
      operationId: assessments_partial_update
      description: |-
        ViewSet for managing student assessments.

        Provides standard CRUD operations for assessments linked to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this assessment.
        required: true
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssessment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssessment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssessment'
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
          description: ''
    delete:
      operationId: assessments_destroy
      description: |-
        ViewSet for managing student assessments.

        Provides standard CRUD operations for assessments linked to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this assessment.
        required: true
      tags:
      - assessments
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/authentication/logout/:
    post:
      operationId: authentication_logout_create
      description: Log out the current authenticated session.
      tags:
      - authentication
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: Successfully logged out.
  /api/authentication/logoutall/:
    post:
      operationId: authentication_logoutall_create
      description: Log out the user from all active authenticated sessions.
      tags:
      - authentication
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: Successfully logged out from all sessions.
  /api/authentication/register/:
    post:
      operationId: authentication_register_create
      description: |-
        Create a new user account.

        Args:
            request: The incoming DRF request containing registration data.

        Returns:
            Response: A `201 Created` response with the serialized user data.
      tags:
      - authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/authentication/session/:
    post:
      operationId: authentication_session_create
      description: |-
        Log in a user and return token-based auth data.

        Args:
            request: The incoming DRF request containing login credentials.
            format: Optional response format passed through by DRF.

        Returns:
            Response: A `200 OK` response containing the Knox token payload
            and serialized user information.
      tags:
      - authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/authentication/test/:
    get:
      operationId: authentication_test_retrieve
      description: |-
        Return a message confirming the user is authenticated.

        Args:
            request: The incoming authenticated DRF request.

        Returns:
            Response: A `200 OK` response with a simple authentication message.
      tags:
      - authentication
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPermissionResponse'
          description: ''
  /api/authentication/username/{user_id}/:
    get:
      operationId: authentication_username_retrieve
      description: |-
        Return the requested user's public identifier fields.

        Args:
            request: The incoming DRF request.
            user_id: The primary key of the user being looked up.

        Returns:
            Response: A `200 OK` payload with the user's ID and username,
            or `404 Not Found` if the user does not exist.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: Primary key of the user to look up.
        required: true
      tags:
      - authentication
      security:
      - knoxApiToken: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameNotFoundResponse'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: |-
        ViewSet for managing user-defined categories.

        Provides standard CRUD operations for categories belonging to the authenticated user.
      tags:
      - categories
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: categories_create
      description: |-
        ViewSet for managing user-defined categories.

        Provides standard CRUD operations for categories belonging to the authenticated user.
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: |-
        ViewSet for managing user-defined categories.

        Provides standard CRUD operations for categories belonging to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      description: |-
        ViewSet for managing user-defined categories.

        Provides standard CRUD operations for categories belonging to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: |-
        ViewSet for managing user-defined categories.

        Provides standard CRUD operations for categories belonging to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: |-
        ViewSet for managing user-defined categories.

        Provides standard CRUD operations for categories belonging to the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/courses/:
    get:
      operationId: courses_list
      description: |-
        Return courses relevant to the authenticated user.

        Args:
            request: The incoming DRF request.

        Returns:
            Response: A response containing the visible course list.
      tags:
      - courses
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
    post:
      operationId: courses_create
      description: |-
        Creates a new course and assigns the requesting user as the lead teacher.

        Args:
            request: The current HttpRequest containing course data.

        Returns:
            A Response object containing the created Course data.
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/{id}/:
    get:
      operationId: courses_retrieve
      description: |-
        Retrieves detailed information about a single course.

        Includes cohort size and a list of enrolled student usernames in the
        response data.

        Args:
            request: The current HttpRequest.
            pk: The primary key of the course to retrieve.

        Returns:
            A Response object containing detailed Course data including enrollment info.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    put:
      operationId: courses_update
      description: |-
        Updates an existing course, respecting granular field-level permissions.

        Args:
            request: The current HttpRequest containing updated data.
            pk: The primary key of the course to update.

        Returns:
            A Response object containing the updated Course data.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    patch:
      operationId: courses_partial_update
      description: |-
        Partially updates a course, respecting granular field-level permissions.

        Args:
            request: The current HttpRequest containing partial update data.
            pk: The primary key of the course.

        Returns:
            A Response object containing the updated Course data.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    delete:
      operationId: courses_destroy
      description: |-
        Performs a soft-delete by deactivating the course.

        Args:
            request: The current HttpRequest.
            pk: The primary key of the course to deactivate.

        Returns:
            A Response object containing the deactivated Course data with a 204 status.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/courses/{id}/events/:
    get:
      operationId: courses_events_retrieve
      description: |-
        View and manage course events.

        GET: Returns a chronological list of events for the specified course.
        POST: Creates a new event for the course, assigning the current user as creator.

        Args:
            request: The current HttpRequest object.
            pk: The primary key of the course.

        Returns:
            A Response object with event data or the created event.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    post:
      operationId: courses_events_create
      description: |-
        View and manage course events.

        GET: Returns a chronological list of events for the specified course.
        POST: Creates a new event for the course, assigning the current user as creator.

        Args:
            request: The current HttpRequest object.
            pk: The primary key of the course.

        Returns:
            A Response object with event data or the created event.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/{id}/join/:
    post:
      operationId: courses_join_create
      description: |-
        Allows the current user to enroll in the specified course.

        Creates a CourseEnrollment instance for the user. If the enrollment
        already exists but is inactive, it is reactivated.

        Args:
            request: The current HttpRequest object.
            pk: The primary key of the course to join.

        Returns:
            A Response indicating success or failure if the course is inactive.
      parameters:
      - in: path
