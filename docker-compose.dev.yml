services:
  backend:
    build: backend
    command: ["uvicorn", "source.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    restart: always
    volumes:
      - ./data:/data
      - ./backend:/app
      - ./media:/app/media
    environment:
      - DEBUG=True
      - POSTGRES=False
      - DB_PATH=/data/db.sqlite3
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery-worker:
    build: backend
    command: ["celery", "-A", "source", "worker", "--loglevel=info"]
    restart: always
    volumes:
      - ./data:/data
      - ./backend:/app
    environment:
      - DEBUG=True
      - POSTGRES=False
      - DB_PATH=/data/db.sqlite3
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery-beat:
    build: backend
    command: ["celery", "-A", "source", "beat", "--loglevel=info", "--schedule=/data/celerybeat-schedule"]
    restart: always
    volumes:
      - ./data:/data
      - ./backend:/app
    environment:
      - DEBUG=True
      - POSTGRES=False
      - DB_PATH=/data/db.sqlite3
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always

  frontend:

    build: frontend
    command: ["nginx", "-g", "daemon off;"]
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./media:/app/media:ro
      - ./frontend/nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
