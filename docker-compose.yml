services:
  backend:
    build: backend
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "source.wsgi:application"]
    restart: always
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - DEBUG=False
    env_file:
      - .env
  frontend:
    build: frontend
    command: ["nginx", "-g", "daemon off;"]
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
  