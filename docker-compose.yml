services:
  backend:
    image: registry.digitalocean.com/segmajor/backend:latest 
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "source.wsgi:application"]
    restart: always
    volumes:
      - ./data:/data
    environment:
      - DEBUG=False
      - DB_PATH=/data/db.sqlite3
    env_file:
      - .env
  frontend:
    image: registry.digitalocean.com/segmajor/frontend:latest
    command: ["nginx", "-g", "daemon off;"]
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend