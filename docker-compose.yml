services:
  backend:
    image: registry.digitalocean.com/segmajor/backend:latest 
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "source.wsgi:application"]
    restart: always
    volumes:
      - ./data:/data
    environment:
      - DEBUG=False
      - POSTGRES=True
      - POSTGRES_HOST=postgres
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
  frontend:
    image: registry.digitalocean.com/segmajor/frontend:latest
    command: ["nginx", "-g", "daemon off;"]
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
